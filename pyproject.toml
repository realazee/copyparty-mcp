[project]
name = "copyparty-mcp"
version = "0.1.0"
description = "MCP server for interacting with a Copyparty file server — browse, read, search, and upload files via AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
impersonate = [
    "httpx-curl-cffi>=0.3.0",
]

[project.scripts]
copyparty-mcp = "copyparty_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
